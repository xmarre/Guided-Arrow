name: Build Guided Arrow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and package
        shell: pwsh
        run: ./build.ps1

      - name: Recover current core
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tools, artifacts/recovered-core | Out-Null
          dotnet tool install ilspycmd --tool-path artifacts/tools
          & artifacts/tools/ilspycmd.exe -p -o artifacts/recovered-core module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll
          if ($LASTEXITCODE -ne 0) { throw "ilspycmd failed with exit code $LASTEXITCODE" }

          Get-ChildItem artifacts/recovered-core -Recurse -Filter *.cs | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $text = [regex]::Replace($text, '\(\([A-Za-z0-9_.<>]+\)\(ref ([^)]+)\)\)\.', '$1.')
            $text = [regex]::Replace($text, '(?<![\w.])MissileCollisionReaction\b', 'Mission.MissileCollisionReaction')
            $text = [regex]::Replace($text, '(?<![\w.])Missile\b', 'Mission.Missile')
            $text = $text.Replace('Mission.Missile Mission.Missile;', 'Mission.Missile Missile;')
            [System.IO.File]::WriteAllText($_.FullName, $text)
          }

          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net472</TargetFramework>
              <LangVersion>latest</LangVersion>
              <AssemblyName>GuidedArrow.RecoveredProbe</AssemblyName>
              <RootNamespace>GuidedArrow</RootNamespace>
              <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <Deterministic>true</Deterministic>
              <DebugType>pdbonly</DebugType>
              <Optimize>true</Optimize>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Bannerlord.ReferenceAssemblies.Core" Version="1.3.15.110062" />
              <PackageReference Include="Bannerlord.ReferenceAssemblies.Native" Version="1.3.15.110062" PrivateAssets="All" />
              <PackageReference Include="Lib.Harmony" Version="2.4.1" PrivateAssets="All" />
              <PackageReference Include="Bannerlord.MCM" Version="5.12.1" IncludeAssets="compile" />
              <PackageReference Include="NETStandard.Library" Version="2.0.3" PrivateAssets="All" />
            </ItemGroup>
          </Project>
          '@ | Set-Content artifacts/recovered-core/GuidedArrow.RecoveredProbe.csproj -Encoding UTF8

      - name: Compile recovered core probe
        id: recovered_core
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: pwsh
        run: |
          & dotnet restore artifacts/recovered-core/GuidedArrow.RecoveredProbe.csproj *> artifacts/recovered-core-restore.log
          $restoreCode = $LASTEXITCODE
          Get-Content artifacts/recovered-core-restore.log
          if ($restoreCode -ne 0) { exit $restoreCode }

          & dotnet build artifacts/recovered-core/GuidedArrow.RecoveredProbe.csproj -c Release --no-restore -o artifacts/recovered-core-build /p:ContinuousIntegrationBuild=true *> artifacts/recovered-core-build.log
          $buildCode = $LASTEXITCODE
          Get-Content artifacts/recovered-core-build.log
          exit $buildCode

      - name: Index recovered penetration path
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          Get-ChildItem artifacts/recovered-core -Recurse -Filter *.cs |
            Select-String -Pattern 'QueuePenetrationContinuation|TrySpawnPenetrationContinuation|OnMissileCollisionReaction|EnsureStandaloneSplitProjectiles|AcquireSplitShotSiblings|Lethal' |
            ForEach-Object { "{0}:{1}:{2}" -f $_.Path, $_.LineNumber, $_.Line.Trim() } |
            Set-Content artifacts/recovered-core/PENETRATION_INDEX.txt -Encoding UTF8

      - name: Upload compiled, source and analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.2.2
          path: |
            dist/*.zip
            checksums/SHA256SUMS.txt
            artifacts/build/GuidedArrow.Progression.dll
            artifacts/build/GuidedArrow.Progression.pdb
            artifacts/recovered-core/**
            artifacts/recovered-core-build/**
            artifacts/recovered-core-restore.log
            artifacts/recovered-core-build.log
          if-no-files-found: error
          retention-days: 30

      - name: Fail when recovered core probe failed
        if: github.event_name == 'pull_request' && steps.recovered_core.outcome == 'failure'
        shell: pwsh
        run: throw 'Recovered core compile probe failed; inspect recovered-core-build.log in the workflow artifact.'

      - name: Resolve release version
        id: release_meta
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $firstLine = ('${{ github.event.head_commit.message }}' -split "`r?`n")[0].Trim()
          if ($firstLine -notmatch '^Release v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release commit must use the exact first-line format: Release vX.Y.Z"
          }
          $version = $Matches.version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write release notes
        if: steps.release_meta.outcome == 'success'
        shell: pwsh
        run: |
          @'
          ## Guided Arrow v1.2.2

          **Compatible with Mount & Blade II: Bannerlord 1.3.15–1.4.7.**

          ### Fixes

          - Moved the **Guided Arrow Mastery** character-screen button to the bottom-right area.
          - Fixed the character-screen overlay input registration so the button is clickable.
          - Added safe deferred navigation from the character screen to the mastery tree.
          - Restricted **Ctrl+U** to the campaign map, preventing crashes when the hotkey is pressed over character-development or other campaign panels.
          - Restored the character-screen button after returning from the mastery tree.

          ### Installation

          1. Delete the existing `Modules/GuidedArrow` folder.
          2. Extract the compiled ZIP into Bannerlord's `Modules` folder.
          3. Enable Guided Arrow and its required dependencies in the launcher.

          ### Requirements

          - Harmony
          - ButterLib
          - UIExtenderEx
          - Mod Configuration Menu v5

          ### Downloads

          - `GuidedArrow-v1.2.2-Bannerlord-1.3.15-to-1.4.7-Universal.zip` — installable module
          - `GuidedArrow-v1.2.2-SOURCE.zip` — current source and module snapshot
          - `SHA256SUMS.txt` — integrity hashes for the release files and binaries
          '@ | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub release
        if: steps.release_meta.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Guided Arrow v${{ steps.release_meta.outputs.version }}
          body_path: release-notes.md
          target_commitish: main
          prerelease: false
          draft: false
          make_latest: true
          files: |
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-Bannerlord-1.3.15-to-1.4.7-Universal.zip
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-SOURCE.zip
            checksums/SHA256SUMS.txt
          fail_on_unmatched_files: true
