name: Build Guided Arrow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Inspect stable core for targeted sidecar hooks
        shell: pwsh
        run: |
          dotnet tool install --tool-path artifacts/tools ilspycmd --version 9.1.0.7988
          artifacts/tools/ilspycmd.exe -t GuidedArrow.GuidedArrowBehavior module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll -o inspection/core --disable-updatecheck
          artifacts/tools/ilspycmd.exe -t GuidedArrow.Settings module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll -o inspection/settings --disable-updatecheck

      - name: Build progression sidecar and package stable core
        shell: pwsh
        run: ./build.ps1

      - name: Upload compiled and source archives
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.3.3
          path: |
            dist/*.zip
            checksums/SHA256SUMS.txt
            artifacts/progression-build/GuidedArrow.Progression.dll
            artifacts/progression-build/GuidedArrow.Progression.pdb
            inspection/core/**
            inspection/settings/**
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release version
        id: release_meta
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $firstLine = ('${{ github.event.head_commit.message }}' -split "`r?`n")[0].Trim()
          if ($firstLine -notmatch '^Release v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release commit must use the exact first-line format: Release vX.Y.Z"
          }
          $version = $Matches.version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write release notes
        if: steps.release_meta.outcome == 'success'
        shell: pwsh
        run: |
          @'
          ## Guided Arrow v${{ steps.release_meta.outputs.version }}

          **Compatible with Mount & Blade II: Bannerlord 1.3.15–1.4.7.**

          ### Final Autoguidance projectile teardown

          - Restores the stable core's deferred native-missile cleanup after a final `PassThrough` impact exhausts the guided penetration budget.
          - Prevents the final cinematic or camera-return handoff from starting while the native removal queue still owns projectile teardown.
          - Makes the existing clean-display-tick gate observe the real native-removal queue instead of an artificially empty queue.
          - Marks a terminal shot generation complete only after the terminal handoff returns successfully.
          - Preserves normal core-owned terminal transitions and cancels the sidecar fallback when the core has already advanced state.
          - Preserves Autoguidance targeting, penetration counts, damage, formations, camera framing and progression balance.
          - Retains the byte-identical verified v1.1.17 gameplay core and applies the correction through the maintained v1.3.3 sidecar.

          ### Installation

          1. Delete the existing `Modules/GuidedArrow` folder.
          2. Extract the compiled ZIP into Bannerlord's `Modules` folder.
          3. Enable Guided Arrow and its required dependencies in the launcher.

          ### Requirements

          - Harmony
          - ButterLib
          - UIExtenderEx
          - Mod Configuration Menu v5
          '@ | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub release
        if: steps.release_meta.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Guided Arrow v${{ steps.release_meta.outputs.version }}
          body_path: release-notes.md
          target_commitish: main
          prerelease: false
          draft: false
          make_latest: true
          files: |
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-Bannerlord-1.3.15-to-1.4.7-Universal.zip
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-SOURCE.zip
            checksums/SHA256SUMS.txt
          fail_on_unmatched_files: true
