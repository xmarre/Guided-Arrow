name: Build Guided Arrow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build progression sidecar and package stable core
        shell: pwsh
        run: ./build.ps1

      - name: Upload compiled and source archives
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.3.0
          path: |
            dist/*.zip
            checksums/SHA256SUMS.txt
            artifacts/progression-build/GuidedArrow.Progression.dll
            artifacts/progression-build/GuidedArrow.Progression.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release version
        id: release_meta
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $firstLine = ('${{ github.event.head_commit.message }}' -split "`r?`n")[0].Trim()
          if ($firstLine -notmatch '^Release v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release commit must use the exact first-line format: Release vX.Y.Z"
          }
          $version = $Matches.version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write release notes
        if: steps.release_meta.outcome == 'success'
        shell: pwsh
        run: |
          @'
          ## Guided Arrow v1.3.0

          **Compatible with Mount & Blade II: Bannerlord 1.3.15–1.4.7.**

          ### Mastery progression overhaul

          - Rebuilt Guided Arrow Mastery as a centre-outward specialization tree.
          - Raised maximum mastery rank to 99 with one mastery point per rank.
          - Converted all 19 masteries from binary unlocks to multi-level skills, generally 10–20 levels each.
          - Added per-level effects, current/next-level details, prerequisite levels and proper specialization pressure.
          - Added a Bannerlord-scaled XP curve with unique-victim, kill, range and multi-kill rewards capped per shot.
          - Added a 0.25–3.00 mastery XP multiplier to the separate progression MCM page.
          - Migrated existing v1 unlocks to level 1 of their corresponding masteries.
          - Fixed Guided Release's initial four-second guidance cap with a direct real-time timeout.

          ### MCM and runtime safety

          - Removed Harmony getter patches from the normal Guided Arrow MCM settings.
          - Mastery limits are now applied only while Guided Arrow mission callbacks execute and the original settings are restored immediately afterwards.
          - Fixed the crash when progression was enabled and the normal Guided Arrow MCM page was opened.
          - The original Guided Arrow MCM values remain the player's upper limits rather than being rewritten by progression.

          ### Existing v1.2.2 fixes retained

          - Bottom-right character-screen mastery button and safe native-state transition.
          - Campaign-map-only **Ctrl+U** shortcut.
          - Stable verified v1.1.17 gameplay core.
          - Hardened and serialised synthetic penetration continuations.
          - Additive native/TOR volleys: original ability arrows and effects remain intact while configured Guided Arrow followers are added on top.

          ### Installation

          1. Delete the existing `Modules/GuidedArrow` folder.
          2. Extract the compiled ZIP into Bannerlord's `Modules` folder.
          3. Enable Guided Arrow and its required dependencies in the launcher.

          ### Requirements

          - Harmony
          - ButterLib
          - UIExtenderEx
          - Mod Configuration Menu v5
          '@ | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub release
        if: steps.release_meta.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Guided Arrow v${{ steps.release_meta.outputs.version }}
          body_path: release-notes.md
          target_commitish: main
          prerelease: false
          draft: false
          make_latest: true
          files: |
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-Bannerlord-1.3.15-to-1.4.7-Universal.zip
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-SOURCE.zip
            checksums/SHA256SUMS.txt
          fail_on_unmatched_files: true
