name: Build Guided Arrow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - name: Build progression sidecar and package stable core
        shell: pwsh
        run: ./build.ps1

      - name: Verify Bannerlord 1.4.7 API compatibility
        shell: pwsh
        run: |
          $project = "src/GuidedArrow.Progression/GuidedArrow.Progression.csproj"
          dotnet restore $project /p:BannerlordReferenceVersion=1.4.7.117484
          dotnet build $project -c Release --no-restore -o artifacts/compatibility-1.4.7 /p:BannerlordReferenceVersion=1.4.7.117484 /p:ContinuousIntegrationBuild=true /p:UseSharedCompilation=false

      - name: Upload compiled and source archives
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.3.4
          path: |
            dist/*.zip
            checksums/SHA256SUMS.txt
            artifacts/progression-build/GuidedArrow.Progression.dll
            artifacts/progression-build/GuidedArrow.Progression.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Refresh tracked v1.3.4 artifacts once
        if: github.event_name == 'pull_request' && hashFiles('.refresh-generated-v1.3.4') != ''
        shell: pwsh
        run: |
          Remove-Item .refresh-generated-v1.3.4 -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- module/GuidedArrow/bin/Win64_Shipping_Client dist checksums .refresh-generated-v1.3.4
          if (git diff --cached --quiet) {
            Write-Host "Tracked artifacts already match the verified v1.3.4 build."
            exit 0
          }
          git commit -m "Refresh v1.3.4 continuation-frame-gate artifacts"
          git push origin HEAD:${{ github.head_ref }}

      - name: Resolve release version
        id: release_meta
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $firstLine = ('${{ github.event.head_commit.message }}' -split "`r?`n")[0].Trim()
          if ($firstLine -notmatch '^Release v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release commit must use the exact first-line format: Release vX.Y.Z"
          }
          $version = $Matches.version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write release notes
        if: steps.release_meta.outcome == 'success'
        shell: pwsh
        run: |
          @'
          ## Guided Arrow v${{ steps.release_meta.outputs.version }}

          **Compatible with Mount & Blade II: Bannerlord 1.3.15–1.4.7.**

          ### Camera, progression, penetration and siege targeting

          - Adds independent switches for the guided-projectile camera and confirmed-kill cinematics.
          - Keeps manual guidance and Autoguidance active while the player remains in the normal combat camera.
          - Prevents the native combat view from freezing when projectile following is disabled.
          - Keeps mission time at 1.0x when Proximity Time Dilation is disabled while preserving Q/E manual control.
          - Defers disabled-kill-camera terminal handling until the native impact callback and a full display-frame boundary have completed.
          - Prevents synthetic penetration continuations from spawning in the native collision tick that queued them.
          - Waits for collision reactions and native missile removals to drain, then spawns at most one eligible continuation per clean tick.
          - Repairs first-time mastery activation by granting the mandatory Guided Release starter level.
          - Makes character-screen mastery navigation tolerant of newer Bannerlord transition screens.
          - Rejects enemies hidden behind fortification geometry before siege Autoguidance commits to them.
          - Adds a Simple Controls MCM page and focused configuration guide.
          - Verifies the sidecar against Bannerlord 1.3.15 and 1.4.7 reference assemblies.
          - Retains the byte-identical verified v1.1.17 gameplay core.

          ### Installation

          1. Delete the existing `Modules/GuidedArrow` folder.
          2. Extract the compiled ZIP into Bannerlord's `Modules` folder.
          3. Enable Guided Arrow and its required dependencies in the launcher.

          ### Requirements

          - Harmony
          - ButterLib
          - UIExtenderEx
          - Mod Configuration Menu v5
          '@ | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub release
        if: steps.release_meta.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Guided Arrow v${{ steps.release_meta.outputs.version }}
          body_path: release-notes.md
          target_commitish: main
          prerelease: false
          draft: false
          make_latest: true
          files: |
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-Bannerlord-1.3.15-to-1.4.7-Universal.zip
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-SOURCE.zip
            checksums/SHA256SUMS.txt
          fail_on_unmatched_files: true
