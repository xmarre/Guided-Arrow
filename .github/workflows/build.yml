name: Build Guided Arrow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - name: Build source core, progression sidecar and packages
        shell: pwsh
        run: ./build.ps1

      - name: Verify Bannerlord 1.4.7 API compatibility
        shell: pwsh
        run: |
          $projects = @(
            "src/GuidedArrow.Core/GuidedArrow.Core.csproj",
            "src/GuidedArrow.Progression/GuidedArrow.Progression.csproj"
          )
          foreach ($project in $projects) {
            $name = [IO.Path]::GetFileNameWithoutExtension($project)
            dotnet restore $project /p:BannerlordReferenceVersion=1.4.7.117484
            dotnet build $project -c Release --no-restore -o "artifacts/compatibility-1.4.7/$name" /p:BannerlordReferenceVersion=1.4.7.117484 /p:ContinuousIntegrationBuild=true /p:UseSharedCompilation=false
          }

      - name: Upload stable, source-core candidate and source archives
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.3.6
          path: |
            dist/*.zip
            checksums/SHA256SUMS.txt
            artifacts/core-build/GuidedArrow.dll
            artifacts/core-build/GuidedArrow.pdb
            artifacts/progression-build/GuidedArrow.Progression.dll
            artifacts/progression-build/GuidedArrow.Progression.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release version
        id: release_meta
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $firstLine = ('${{ github.event.head_commit.message }}' -split "`r?`n")[0].Trim()
          if ($firstLine -notmatch '^Release v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release commit must use the exact first-line format: Release vX.Y.Z"
          }
          $version = $Matches.version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write release notes
        if: steps.release_meta.outcome == 'success'
        shell: pwsh
        run: |
          @'
          ## Guided Arrow v${{ steps.release_meta.outputs.version }}

          **Compatible with Mount & Blade II: Bannerlord 1.3.15–1.4.7.**

          ### Mission audio, penetration stability and Autoguidance

          - Restores battle-command voices and normal mission audio by keeping the maintained sidecar off Bannerlord's native `Mission.*` collision and tick methods.
          - Fixes protected-memory crashes during repeated terminal penetration continuations.
          - Restores configured finite and infinite agent penetration across native `PassThrough`, `Stick` and `BecomeInvisible` reactions.
          - Keeps shields, terrain, walls, trees and other world collisions terminal.
          - Correlates simultaneous collision reactions with the exact owning projectile and protects concentrated split volleys from recycled missile indices and reaction-queue trimming.
          - Preserves camera ownership through valid penetration chains and restores the native combat camera cleanly when the guided swarm ends.
          - Repairs Autoguidance target state after impacts and continuation materialization without duplicate retarget passes.
          - Creates generated split followers before manual guidance or Autoguidance initializes.
          - Improves siege Autoguidance by leaving normal obstacle routing active while making the strict direct-line target filter optional and disabled by default.
          - Moves Follow the Guided Projectile into Projectile Camera, Play Kill Cinematics into Kill Cinematic, and Visible Siege Targets Only into Autonomous Guidance on the main MCM page.
          - Preserves values saved through the former Simple Controls page and hides that duplicate page.
          - Verifies both source projects against Bannerlord 1.3.15 and 1.4.7 reference assemblies.

          ### Installation

          1. Delete the existing `Modules/GuidedArrow` folder.
          2. Extract the compiled ZIP into Bannerlord's `Modules` folder.
          3. Enable Guided Arrow and its required dependencies in the launcher.

          ### Requirements

          - Harmony
          - ButterLib
          - UIExtenderEx
          - Mod Configuration Menu v5
          '@ | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub release
        if: steps.release_meta.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Guided Arrow v${{ steps.release_meta.outputs.version }}
          body_path: release-notes.md
          target_commitish: main
          prerelease: false
          draft: false
          make_latest: true
          files: |
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-Bannerlord-1.3.15-to-1.4.7-Universal.zip
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-SOURCE.zip
            checksums/SHA256SUMS.txt
          fail_on_unmatched_files: true
