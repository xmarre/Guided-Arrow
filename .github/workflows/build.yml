name: Build Guided Arrow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build progression sidecar and package stable core
        shell: pwsh
        run: ./build.ps1

      - name: Upload compiled and source archives
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.2.2
          path: |
            dist/*.zip
            checksums/SHA256SUMS.txt
            artifacts/progression-build/GuidedArrow.Progression.dll
            artifacts/progression-build/GuidedArrow.Progression.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Resolve release version
        id: release_meta
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        run: |
          $firstLine = ('${{ github.event.head_commit.message }}' -split "`r?`n")[0].Trim()
          if ($firstLine -notmatch '^Release v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release commit must use the exact first-line format: Release vX.Y.Z"
          }
          $version = $Matches.version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Write release notes
        if: steps.release_meta.outcome == 'success'
        shell: pwsh
        run: |
          @'
          ## Guided Arrow v1.2.2

          **Compatible with Mount & Blade II: Bannerlord 1.3.15–1.4.7.**

          ### Fixes

          - Moved the **Guided Arrow Mastery** character-screen button to the bottom-right area.
          - Fixed the overlay input handling so the button is clickable.
          - Closed Bannerlord's native character-development game state before opening mastery.
          - Waited for the campaign map and map bar to stabilise before pushing the mastery screen.
          - Restricted **Ctrl+U** to the campaign map.
          - Restored the character-screen button after returning from mastery.
          - Restored the exact verified v1.1.17 core runtime after the recovered-core test build caused a native mission-start crash.

          ### Installation

          1. Delete the existing `Modules/GuidedArrow` folder.
          2. Extract the compiled ZIP into Bannerlord's `Modules` folder.
          3. Enable Guided Arrow and its required dependencies in the launcher.

          ### Requirements

          - Harmony
          - ButterLib
          - UIExtenderEx
          - Mod Configuration Menu v5

          Penetration and TOR native-volley changes are not included in this stable-core recovery build. They require a separate targeted patch and in-game verification.
          '@ | Set-Content release-notes.md -Encoding UTF8

      - name: Publish GitHub release
        if: steps.release_meta.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Guided Arrow v${{ steps.release_meta.outputs.version }}
          body_path: release-notes.md
          target_commitish: main
          prerelease: false
          draft: false
          make_latest: true
          files: |
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-Bannerlord-1.3.15-to-1.4.7-Universal.zip
            dist/GuidedArrow-v${{ steps.release_meta.outputs.version }}-SOURCE.zip
            checksums/SHA256SUMS.txt
          fail_on_unmatched_files: true
