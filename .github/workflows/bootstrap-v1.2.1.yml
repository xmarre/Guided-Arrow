name: Bootstrap Guided Arrow v1.2.1 repository

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reconstruct and verify exact source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'work', 'work/core', 'checksums' | Out-Null
          $chunkPaths = @(
            'bootstrap/source.000.b64',
            'bootstrap/source.001.b64',
            'bootstrap/source.002a.b64',
            'bootstrap/source.002b.b64',
            'bootstrap/source.003a.b64',
            'bootstrap/source.003b.b64'
          )
          foreach ($chunkPath in $chunkPaths) {
            if (-not (Test-Path $chunkPath)) { throw "Missing source chunk: $chunkPath" }
          }
          $sourceBase64 = [string]::Concat(($chunkPaths | ForEach-Object { [IO.File]::ReadAllText($_) }))
          [IO.File]::WriteAllBytes('work/source-bootstrap.zip', [Convert]::FromBase64String($sourceBase64))
          $sourceHash = (Get-FileHash 'work/source-bootstrap.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source bootstrap SHA-256: $sourceHash"
          if ($sourceHash -ne '5cebf175ad663c055fb3d70ab702f465644537976ad2b87eacb64d943337a08a') {
            throw "Source bootstrap SHA-256 mismatch: $sourceHash"
          }

      - name: Download and verify exact v1.1.17 core archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $blobUrl = 'https://api.github.com/repos/xmarre/MapPerfFix/git/blobs/3d8a935613b81546ea03cff97afe3df0802c741a'
          $headers = @{
            'Accept' = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'Guided-Arrow-Repository-Bootstrap'
          }
          $blob = Invoke-RestMethod -Uri $blobUrl -Headers $headers
          if ($blob.encoding -ne 'base64') { throw "Unexpected GitHub blob encoding: $($blob.encoding)" }
          $decodedBlob = [Convert]::FromBase64String(($blob.content -replace '\s', ''))
          $coreArchiveBase64 = [Text.Encoding]::UTF8.GetString($decodedBlob)
          [IO.File]::WriteAllBytes('work/core.zip', [Convert]::FromBase64String($coreArchiveBase64))
          $coreHash = (Get-FileHash 'work/core.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Core archive SHA-256: $coreHash"
          if ($coreHash -ne '7a6d1d73581ef73d491281baf33a372da3aa7209871d4d463938c5361aac3241') {
            throw "Core archive SHA-256 mismatch: $coreHash"
          }

      - name: Materialise, build and package repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath 'work/source-bootstrap.zip' -DestinationPath '.' -Force
          Expand-Archive -LiteralPath 'work/core.zip' -DestinationPath 'work/core' -Force

          $moduleBin = 'module/GuidedArrow/bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $moduleBin, 'checksums' | Out-Null
          Copy-Item 'work/core/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll' "$moduleBin/GuidedArrow.dll" -Force

          $coreDllHash = (Get-FileHash "$moduleBin/GuidedArrow.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Core DLL SHA-256: $coreDllHash"
          if ($coreDllHash -ne '0f84dcfe256b4c0235707a463e2fadb6ca6b05027d7bafb5e7313965d3d98af0') {
            throw "Core DLL SHA-256 mismatch: $coreDllHash"
          }

          ./build.ps1

          $required = @(
            'src/GuidedArrow.Progression/GuidedArrow.Progression.csproj',
            'src/GuidedArrow.Progression/ProgressionSettings.cs',
            'src/GuidedArrow.Progression/CharacterScreenButton.cs',
            'module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll',
            'module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.Progression.dll',
            'module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.Progression.pdb',
            'dist/GuidedArrow-v1.2.1-Bannerlord-1.3.15-to-1.4.7-Universal.zip',
            'dist/GuidedArrow-v1.2.1-SOURCE.zip',
            'checksums/SHA256SUMS.txt',
            '.github/workflows/build.yml'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Required repository output missing: $path" }
          }

          $packagedCoreHash = (Get-FileHash "$moduleBin/GuidedArrow.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($packagedCoreHash -ne '0f84dcfe256b4c0235707a463e2fadb6ca6b05027d7bafb5e7313965d3d98af0') {
            throw "Packaged core DLL changed unexpectedly: $packagedCoreHash"
          }

      - name: Upload verified repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.2.1-repository-import
          path: |
            dist/*.zip
            checksums/SHA256SUMS.txt
            module/GuidedArrow/bin/Win64_Shipping_Client/*.dll
            module/GuidedArrow/bin/Win64_Shipping_Client/*.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Commit clean source and compiled outputs
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item 'bootstrap' -Recurse -Force
          Remove-Item '.bootstrap' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item 'work' -Recurse -Force
          Remove-Item 'diagnostics' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item '.github/workflows/bootstrap-v1.2.1.yml' -Force
          Remove-Item 'artifacts' -Recurse -Force -ErrorAction SilentlyContinue

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'Bootstrap produced no repository changes.' }
          git commit -m 'Add clean Guided Arrow v1.2.1 source and compiled module'
          git push origin "HEAD:$env:HEAD_BRANCH"
