name: Normalize remaining core source

on:
  push:
    branches: [refactor/source-core-build]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-core-build
          fetch-depth: 0

      - name: Normalize member-chain ref casts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'src/GuidedArrow.Core/GuidedArrow/GuidedArrowBehavior.cs'
          $content = Get-Content $file -Raw
          $pattern = '\(\([A-Za-z_][A-Za-z0-9_\.<>]*\)\(ref ([A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+)\)\)'
          $matches = [regex]::Matches($content, $pattern)
          $normalized = [regex]::Replace($content, $pattern, '$1')
          Write-Host "Normalized $($matches.Count) member-chain ref-cast expression(s)."
          if ($normalized -ne $content) {
            Set-Content $file $normalized -Encoding UTF8
          }

      - name: Commit normalized source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/GuidedArrow.Core/GuidedArrow/GuidedArrowBehavior.cs
          if (git diff --cached --quiet) {
            Write-Host 'No remaining member ref-cast changes.'
            exit 0
          }
          git commit -m 'Normalize remaining core member access syntax'
          git push origin HEAD:refactor/source-core-build
