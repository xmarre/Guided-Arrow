name: Inspect Guided Arrow Core

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - name: Install ILSpy command line
        shell: pwsh
        run: dotnet tool install --global ilspycmd

      - name: Decompile stable collision types
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/core-decompile | Out-Null
          $dll = "module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll"
          ilspycmd -t GuidedArrow.GuidedArrowBehavior -o artifacts/core-decompile $dll
          ilspycmd -t GuidedArrow.MissileDamageBridge -o artifacts/core-decompile $dll
          Get-ChildItem artifacts/core-decompile -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Upload decompiled collision types
        uses: actions/upload-artifact@v4
        with:
          name: guided-arrow-core-collision-types
          path: artifacts/core-decompile/**
          if-no-files-found: error
          retention-days: 3
