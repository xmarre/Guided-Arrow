name: Inspect full Guided Arrow core

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Decompile complete core
        shell: pwsh
        run: |
          dotnet tool install ilspycmd --tool-path .tools
          New-Item -ItemType Directory -Force artifacts/decompiled | Out-Null
          $core = "module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll"
          & .tools/ilspycmd.exe -p -o artifacts/decompiled $core
      - name: Upload decompiled core
        uses: actions/upload-artifact@v4
        with:
          name: full-guided-arrow-core
          path: artifacts/decompiled
          if-no-files-found: error
          retention-days: 1
