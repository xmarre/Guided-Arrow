name: Inspect Guided Arrow continuation core

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Decompile locked continuation code path
        shell: pwsh
        run: |
          dotnet tool install ilspycmd --tool-path .tools
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $core = "module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll"
          & .tools/ilspycmd.exe -t GuidedArrow.GuidedArrowBehavior $core | Set-Content artifacts/core-behavior.cs -Encoding UTF8
          $patterns = @(
            "QueuePenetrationContinuation",
            "ProcessDeferredNativeMissileWork",
            "TrySpawnPenetrationContinuation",
            "AddCustomMissile"
          )
          Select-String -Path artifacts/core-behavior.cs -Pattern $patterns -Context 8,45 | ForEach-Object {
            $_.Context.PreContext
            $_.Line
            $_.Context.PostContext
            "----"
          }

      - name: Upload decompiled core behavior
        uses: actions/upload-artifact@v4
        with:
          name: guided-arrow-core-continuation-il
          path: artifacts/core-behavior.cs
          if-no-files-found: error
          retention-days: 1
