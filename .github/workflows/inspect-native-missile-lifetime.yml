name: Inspect Bannerlord missile lifetime

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.423

      - name: Restore Bannerlord references
        shell: pwsh
        run: dotnet restore src/GuidedArrow.Progression/GuidedArrow.Progression.csproj /p:BannerlordReferenceVersion=1.3.15.110062

      - name: Decompile native missile lifetime paths
        shell: pwsh
        run: |
          dotnet tool install ilspycmd --tool-path .tools
          $pkg = Join-Path $env:USERPROFILE '.nuget\packages\bannerlord.referenceassemblies.core\1.3.15.110062'
          $dll = Get-ChildItem $pkg -Recurse -Filter TaleWorlds.MountAndBlade.dll | Select-Object -First 1
          if (-not $dll) { throw 'TaleWorlds.MountAndBlade.dll not found in restored package.' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & .tools/ilspycmd.exe -t TaleWorlds.MountAndBlade.Mission $dll.FullName | Set-Content artifacts/Mission.cs -Encoding UTF8
          & .tools/ilspycmd.exe -t TaleWorlds.MountAndBlade.Missile $dll.FullName | Set-Content artifacts/Missile.cs -Encoding UTF8
          & .tools/ilspycmd.exe -t TaleWorlds.MountAndBlade.MBMissile $dll.FullName | Set-Content artifacts/MBMissile.cs -Encoding UTF8
          Get-ChildItem $pkg -Recurse -Filter TaleWorlds.Engine.dll | Select-Object -First 1 | ForEach-Object {
            & .tools/ilspycmd.exe -p -o artifacts/engine $_.FullName
          }

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: bannerlord-missile-lifetime-inspection
          path: artifacts/**
          if-no-files-found: error
          retention-days: 1
