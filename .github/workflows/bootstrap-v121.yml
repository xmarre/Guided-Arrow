name: Bootstrap Guided Arrow v1.2.1 Repository

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out the pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Reconstruct and verify exact inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path work/source, work/core | Out-Null

          $sourceB64 = ((Get-ChildItem '.bootstrap/source.part*.b64' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          [IO.File]::WriteAllBytes('work/source/bootstrap.zip', [Convert]::FromBase64String($sourceB64))
          $sourceHash = (Get-FileHash 'work/source/bootstrap.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source bootstrap SHA-256: $sourceHash"
          if ($sourceHash -ne '5cebf175ad663c055fb3d70ab702f465644537976ad2b87eacb64d943337a08a') {
            throw "Source bootstrap hash mismatch: $sourceHash"
          }

          $coreB64 = ((Get-ChildItem '.bootstrap/core.*.b64' | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
          [IO.File]::WriteAllBytes('work/core/core.zip', [Convert]::FromBase64String($coreB64))
          $coreZipHash = (Get-FileHash 'work/core/core.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Core archive SHA-256: $coreZipHash"
          if ($coreZipHash -ne '7a6d1d73581ef73d491281baf33a372da3aa7209871d4d463938c5361aac3241') {
            throw "Core archive hash mismatch: $coreZipHash"
          }

          Expand-Archive 'work/core/core.zip' 'work/core/extracted' -Force
          $coreDll = 'work/core/extracted/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll'
          $coreDllHash = (Get-FileHash $coreDll -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Core DLL SHA-256: $coreDllHash"
          if ($coreDllHash -ne '0f84dcfe256b4c0235707a463e2fadb6ca6b05027d7bafb5e7313965d3d98af0') {
            throw "Core DLL hash mismatch: $coreDllHash"
          }

      - name: Materialise source and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive 'work/source/bootstrap.zip' '.' -Force
          $moduleBin = 'module/GuidedArrow/bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Force -Path $moduleBin, checksums | Out-Null
          Copy-Item 'work/core/extracted/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll' "$moduleBin/GuidedArrow.dll" -Force

      - name: Build and package
        shell: pwsh
        run: ./build.ps1

      - name: Verify release outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll',
            'module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.Progression.dll',
            'module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.Progression.pdb',
            'dist/GuidedArrow-v1.2.1-Bannerlord-1.3.15-to-1.4.7-Universal.zip',
            'dist/GuidedArrow-v1.2.1-SOURCE.zip',
            'checksums/SHA256SUMS.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing output: $path" }
          }

          $builtCoreHash = (Get-FileHash 'module/GuidedArrow/bin/Win64_Shipping_Client/GuidedArrow.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($builtCoreHash -ne '0f84dcfe256b4c0235707a463e2fadb6ca6b05027d7bafb5e7313965d3d98af0') {
            throw "Packaged core DLL changed unexpectedly: $builtCoreHash"
          }

      - name: Upload verified release snapshot
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.2.1-repository-import
          path: |
            dist/*.zip
            checksums/SHA256SUMS.txt
            module/GuidedArrow/bin/Win64_Shipping_Client/*.dll
            module/GuidedArrow/bin/Win64_Shipping_Client/*.pdb
          if-no-files-found: error
          retention-days: 30

      - name: Commit the clean repository tree
        shell: pwsh
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item '.bootstrap' -Recurse -Force
          Remove-Item '.github/workflows/bootstrap-v121.yml' -Force
          Remove-Item 'work' -Recurse -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Guided Arrow v1.2.1 source and release artifacts'
          git push origin "HEAD:$env:HEAD_BRANCH"
